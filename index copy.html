<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشاور هوشمند دوره‌ها</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f7f6; }
        #chat-container { width: 500px; border: 1px solid #ccc; border-radius: 8px; display: flex; flex-direction: column; background-color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #messages { height: 400px; overflow-y: auto; padding: 10px; border-bottom: 1px solid #ccc; }
        .message { margin-bottom: 10px; padding: 10px 15px; border-radius: 18px; max-width: 80%; line-height: 1.5; }
        .user { background-color: #dcf8c6; text-align: left; align-self: flex-start; margin-right: auto; }
        .assistant { background-color: #f1f0f0; text-align: left; align-self: flex-end; margin-left: auto; }
        #input-area { display: flex; padding: 10px; border-top: 1px solid #eee; }
        #userInput { flex-grow: 1; border: 1px solid #ccc; padding: 10px; border-radius: 20px; font-size: 14px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; margin-right: 10px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages">
             <div class="message assistant">سلام! من مشاور هوشمند شما هستم. در مورد علاقه‌مندی‌ها، اهداف شغلی یا سوالات کلی خودتان از من بپرسید.</div>
        </div>
        <div id="input-area">
            <button id="sendButton">ارسال</button>
            <input type="text" id="userInput" placeholder="سوال خود را بپرسید...">
        </div>
    </div>
    <script>
        const sendButton = document.getElementById('sendButton');
        const userInput = document.getElementById('userInput');
        const messagesDiv = document.getElementById('messages');
        const chatApiUrl = 'http://127.0.0.1:8000/chat';

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessageToUI('user', message);
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;

            try {
                const response = await fetch(chatApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                addMessageToUI('assistant', data.response);

            } catch (e) {
                console.error("Error:", e);
                addMessageToUI('assistant', 'متاسفانه در ارتباط با سرور مشکلی پیش آمده.');
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        function addMessageToUI(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text; 
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.focus();
    </script>
</body>
</html>
